<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sit Spot Journal</title>
<meta name="theme-color" content="#15110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sit Spot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="description" content="A sit spot journal from The Outdoor Practice. Same place, different day. Notice the land, track your visitors, and watch the year turn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one calm column, like a field notebook. Tree mark header, three tabs, then the page. */
/* Deliberately a single dawn-on-the-moor look, in every theme. Earth pigments: charcoal, ochre, clay, bone, lichen. */
:root {
  --bg: #15110d;
  --surface: rgba(30, 23, 18, 0.82);
  --solid: #1e1712;
  --ink: #efe6d6;
  --muted: #b8ab96;
  --line: rgba(239, 230, 214, 0.15);
  --forest: #f5ebd9;
  --moss: #bcc68f;
  --ember: #dc8d50;
  --ember-soft: rgba(220, 141, 80, 0.15);
  --moss-soft: rgba(188, 198, 143, 0.12);
  --focus: #dc8d50;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
#moor { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; pointer-events: none; }
.wrap { position: relative; z-index: 1; }
#view { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 18px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
#view textarea { background: rgba(255, 255, 255, 0.04); }
#view .c-card, #view .empty { background: rgba(255, 255, 255, 0.035); }
.tabs { text-shadow: 0 1px 10px rgba(0,0,0,0.7); }
.foot { text-shadow: 0 1px 8px rgba(0,0,0,0.8); }
.a2hs { background: var(--solid) !important; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(20px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--display); color: var(--forest); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2.4rem; font-weight: 500; }
h2 { font-size: 1.7rem; font-weight: 500; }
h3 { font-size: 1.25rem; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
a { color: var(--moss); }

/* Header */
.brand { display: flex; align-items: center; gap: 10px; color: var(--forest); }
.brand svg { width: 28px; height: 28px; flex: none; }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; color: var(--forest); }
.head { display: flex; flex-direction: column; gap: 10px; padding-top: 10vh; padding-bottom: 2vh; text-shadow: 0 2px 16px rgba(0,0,0,0.65); }
.tagline { font-family: var(--display); font-style: italic; font-size: 1.15rem; color: var(--ember); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab {
  background: none; border: 0; padding: 10px 14px 9px; cursor: pointer; color: var(--muted);
  font-size: 0.9rem; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab[aria-selected="true"] { color: var(--forest); border-bottom-color: var(--ember); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 9px 18px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 0.9rem; font-weight: 500;
}
.btn:hover { border-color: var(--moss); }
.btn.primary { background: var(--forest); color: var(--bg); border-color: var(--forest); }
.btn.primary:hover { opacity: 0.92; }
.btn.danger { color: var(--ember); border-color: var(--ember); background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 4px; }
.btn.small { padding: 5px 12px; font-size: 0.82rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }

/* Journal list */
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.item {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 4px 12px; align-items: baseline;
  padding: 14px 4px; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-inline: 0; border-top: 0; text-align: left; width: 100%;
}
.item:hover { background: var(--moss-soft); }
.num { font-family: var(--display); font-size: 1.5rem; color: var(--ember); font-variant-numeric: tabular-nums lining-nums; line-height: 1; }
.item-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item-title { font-family: var(--display); font-size: 1.25rem; font-weight: 600; color: var(--forest); line-height: 1.2; overflow-wrap: anywhere; }
.item-meta { font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
.item-date { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-size: 0.72rem; padding: 1px 8px; border-radius: 999px; background: var(--moss-soft); color: var(--moss); font-weight: 500; }
.chip.warm { background: var(--ember-soft); color: var(--ember); }

.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 28px 22px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); }
.empty p { color: var(--muted); max-width: 52ch; }

/* Editor */
.sheet { display: flex; flex-direction: column; gap: 26px; }
.sheet-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.status { font-size: 0.78rem; color: var(--muted); margin-left: auto; }
.status.err { color: var(--ember); }
.section { display: flex; flex-direction: column; gap: 16px; padding-top: 18px; border-top: 1px solid var(--forest); }
.section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-head .hint { font-family: var(--display); font-style: italic; color: var(--ember); font-size: 1.05rem; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.label { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--forest); }
.label em { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); font-size: 0.8rem; margin-left: 6px; }
input[type="text"], input[type="date"], input[type="time"], input[type="number"], textarea {
  width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 6px 2px; border-radius: 0;
}
textarea { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); resize: vertical; line-height: 1.65; }
input:focus, textarea:focus { outline: none; border-color: var(--moss); }
textarea.mid { min-height: 84px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggles button {
  border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 0.85rem;
}
.toggles button[aria-pressed="true"] { background: var(--moss); color: var(--bg); border-color: var(--moss); }
.scale { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.scale button {
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--moss); background: transparent; cursor: pointer;
  font-size: 0.8rem; color: var(--moss); font-variant-numeric: tabular-nums;
}
.scale button[aria-pressed="true"] { background: var(--moss); color: var(--bg); }
.scale .ends { font-size: 0.75rem; color: var(--muted); }
.loc { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
.shields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.shield {
  text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: transparent; cursor: pointer;
  display: flex; flex-direction: column; gap: 2px;
}
.shield b { font-family: var(--display); font-size: 1.15rem; color: var(--forest); font-weight: 600; }
.shield span { font-size: 0.8rem; color: var(--muted); }
.shield[aria-pressed="true"] { border-color: var(--ember); background: var(--ember-soft); }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.88rem; color: var(--ember); }

/* Patterns */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th { text-align: left; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--forest); font-weight: 600; padding: 8px 6px; border-bottom: 1px solid var(--forest); white-space: nowrap; }
td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
td.n { color: var(--ember); font-weight: 600; width: 3.5em; }
td.v { font-family: var(--display); font-size: 1.15rem; color: var(--forest); font-weight: 600; }
td.d { white-space: nowrap; color: var(--muted); font-size: 0.85rem; }
.block { display: flex; flex-direction: column; gap: 12px; }
.months { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.month { display: grid; grid-template-columns: 9em 3em 1fr; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); align-items: baseline; }
.month .m { font-family: var(--display); font-size: 1.1rem; color: var(--forest); font-weight: 600; }
.month .c { color: var(--ember); font-weight: 600; font-variant-numeric: tabular-nums; }
.month .chips { margin: 0; min-width: 0; }
svg text { font-family: var(--body); }
.chart { width: 100%; height: auto; display: block; }
.ax { stroke: var(--line); stroke-width: 1; }
.axl { fill: var(--muted); font-size: 11px; }
.l-arrive { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
.l-leave { stroke: var(--moss); stroke-width: 2.5; fill: none; }
.d-arrive { fill: var(--bg); stroke: var(--muted); stroke-width: 1.5; }
.d-leave { fill: var(--moss); }
.legend { display: flex; gap: 16px; font-size: 0.8rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px dashed var(--muted); vertical-align: middle; margin-right: 6px; }
.legend i.leave { border-top: 2.5px solid var(--moss); }
.compass { width: min(100%, 420px); height: auto; display: block; margin: 0 auto; }
.c-ring { fill: none; stroke: var(--line); stroke-width: 1.5; }
.c-cross { stroke: var(--line); stroke-width: 1; }
.c-dir { fill: var(--forest); font-family: var(--display); font-size: 19px; font-weight: 600; }
.c-sub { fill: var(--muted); font-size: 12px; letter-spacing: 0.06em; }
.c-num { fill: var(--moss); font-family: var(--display); font-size: 30px; font-weight: 600; }
.c-num.top { fill: var(--ember); }
.c-dot { fill: var(--moss-soft); stroke: var(--moss); stroke-width: 1; }
.c-dot.top { fill: var(--ember-soft); stroke: var(--ember); }
.stat { display: flex; gap: 24px; flex-wrap: wrap; }
.stat div { display: flex; flex-direction: column; }
.stat b { font-family: var(--display); font-size: 1.8rem; color: var(--forest); font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.78rem; color: var(--muted); }

/* Guide */
.guide { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
details { border-bottom: 1px solid var(--line); }
summary { cursor: pointer; padding: 14px 2px; list-style: none; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
summary::-webkit-details-marker { display: none; }
summary h3 { font-size: 1.35rem; }
summary .plus { color: var(--ember); font-size: 1.2rem; transition: transform .2s; }
details[open] summary .plus { transform: rotate(45deg); }
.g-body { padding: 0 2px 20px; display: flex; flex-direction: column; gap: 10px; max-width: 62ch; }
.g-lead { font-family: var(--display); font-style: italic; color: var(--ember); font-size: 1.1rem; }
.g-body ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 8px; }
.g-body li::marker { color: var(--ember); }
.g-body strong { color: var(--forest); font-weight: 600; }
.g-sub { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--forest); margin-top: 6px; }

.foot { font-size: 0.78rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.toast { font-size: 0.82rem; color: var(--muted); }

@media (max-width: 520px) {
  h1 { font-size: 2rem; }
  .grid3 { grid-template-columns: 1fr 1fr; }
  .grid3 .wide { grid-column: 1 / -1; }
  .grid2 { grid-template-columns: 1fr; }
  .item { grid-template-columns: 36px 1fr; }
  .item-date { grid-column: 2; }
  .month { grid-template-columns: 1fr auto; }
  .month .chips { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Course */
.course { display: flex; flex-direction: column; gap: 18px; }
.c-head { display: flex; flex-direction: column; gap: 10px; }
.c-prog { height: 6px; border-radius: 3px; background: var(--moss-soft); overflow: hidden; }
.c-prog span { display: block; height: 100%; background: var(--moss); border-radius: 3px; }
.lessons { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.lesson-row { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 13px 2px; cursor: pointer; }
.lesson-row:hover { background: var(--moss-soft); }
.l-num { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--moss); color: var(--moss); display: grid; place-items: center; font-size: 0.82rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.l-num.done { background: var(--moss); color: var(--bg); }
.l-main { min-width: 0; display: flex; flex-direction: column; }
.l-title { font-family: var(--display); font-size: 1.2rem; font-weight: 600; color: var(--forest); line-height: 1.2; }
.l-sub { font-size: 0.8rem; color: var(--muted); }
.l-meta { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.c-lesson h2 { font-size: 1.6rem; }
.c-lead { font-family: var(--display); font-style: italic; color: var(--ember); font-size: 1.1rem; }
.c-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 12px; min-height: 300px; animation: cardIn .25s ease-out; }
@keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.c-count { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--ember); }
.c-card h3 { font-size: 1.55rem; }
.c-body { display: flex; flex-direction: column; gap: 10px; font-size: 1rem; line-height: 1.65; max-width: 60ch; }
.c-body p { margin: 0; }
.c-body ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 9px; }
.c-body li::marker { color: var(--ember); }
.c-body strong { color: var(--forest); font-weight: 600; }
.c-try { margin-top: auto; border-left: 3px solid var(--moss); background: var(--moss-soft); border-radius: 0 10px 10px 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.c-try span { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--moss); }
.c-try p { margin: 0; font-size: 0.93rem; }
.c-dots { display: flex; gap: 6px; justify-content: center; }
.c-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.c-dots i.past { background: var(--moss); opacity: 0.5; }
.c-dots i.on { background: var(--ember); width: 18px; border-radius: 4px; }
.btn:disabled { opacity: 0.45; cursor: default; }
@media (prefers-reduced-motion: reduce) { .c-card { animation: none; } }
@media (max-width: 520px) { .lesson-row { grid-template-columns: 34px 1fr; } .l-meta { display: none; } .c-card { padding: 18px 16px 20px; min-height: 340px; } }
</style>
</head>
<body>
<canvas id="moor" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="head">
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="45" fill="none" stroke="var(--moss)" stroke-width="3.5"/>
        <g stroke="currentColor" stroke-width="3.5" fill="none">
          <line x1="50" y1="12" x2="50" y2="88"/>
          <polyline points="32.5,47.5 50,30 67.5,47.5"/>
          <polyline points="36,59 50,45 64,59"/>
        </g>
      </svg>
      <span class="eyebrow">The Outdoor Practice</span>
    </div>
    <h1>Sit Spot Journal</h1>
    <p class="tagline">Same place. Different day.</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tab-journal" data-view="journal" aria-selected="true">Journal</button>
    <button class="tab" role="tab" id="tab-patterns" data-view="patterns" aria-selected="false">Patterns</button>
    <button class="tab" role="tab" id="tab-guide" data-view="guide" aria-selected="false">Guide</button>
  </nav>

  <main id="view" aria-live="polite"></main>

  <footer class="foot">Saved in this browser only, on this device. Export a copy now and again, and always before clearing your browsing data.</footer>
</div>

<script>
const KEY = "top-sit-spot-v1";
const WEATHER = ["Sun", "Cloud", "Rain", "Drizzle", "Wind", "Still", "Fog", "Frost", "Snow"];
const TEMP = ["Cold", "Cool", "Mild", "Warm", "Hot"];
const SHIELDS = [
  { id: "South", sub: "Summer · the child", hint: "Body, feeling, play" },
  { id: "West", sub: "Autumn · the adolescent", hint: "Inward, dreams, shadow" },
  { id: "North", sub: "Winter · the adult", hint: "Mind, responsibility" },
  { id: "East", sub: "Spring · the elder", hint: "Spirit, insight, renewal" },
];

const state = { view: "journal", sits: [], editingId: null, draft: null, dirty: false, confirmDelete: false, status: "", statusErr: false, locMsg: "" };
let saveTimer = null, exportMsg = "";

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const fmtDate = (s) => { if (!s) return ""; const d = new Date(s + "T12:00:00"); return isNaN(d) ? s : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); };
const tags = (s) => String(s || "").split(",").map(t => t.trim()).filter(Boolean);

function blank() {
  const last = sorted().slice(-1)[0];
  return {
    date: today(), time: nowTime(), minutes: "", place: last ? last.place || "" : "", coords: null,
    weather: [], temp: "", arrive: 0, leave: 0,
    seen: "", heard: "", smelled: "", felt: "",
    visitors: "", changed: "", inner: "", shield: "", shieldNote: "", carry: "", created: Date.now(),
  };
}
function sorted() { return [...state.sits].sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.time || "").localeCompare(b.time || "") || (a.created || 0) - (b.created || 0)); }
function numberOf(id) { const i = sorted().findIndex(d => d.id === id); return i < 0 ? sorted().length + 1 : i + 1; }

/* ---------- Storage ---------- */
function load() { try { const raw = localStorage.getItem(KEY); state.sits = raw ? JSON.parse(raw) : []; } catch (e) { state.sits = []; } }
function saveAll() { try { localStorage.setItem(KEY, JSON.stringify(state.sits)); return true; } catch (e) { return false; } }
function persist() {
  if (!state.draft) return;
  const rec = { ...structuredClone(state.draft), id: state.editingId };
  const i = state.sits.findIndex(d => d.id === rec.id);
  if (i < 0) state.sits.push(rec); else state.sits[i] = rec;
  const ok = saveAll();
  state.dirty = false; state.statusErr = !ok;
  state.status = ok ? "Saved" : "Couldn't save in this browser. Export a copy to keep it safe.";
  paintStatus();
}
function scheduleSave() {
  state.dirty = true; state.status = "Editing…"; state.statusErr = false; paintStatus();
  clearTimeout(saveTimer); saveTimer = setTimeout(persist, 700);
}
function flush() { if (state.dirty) { clearTimeout(saveTimer); persist(); } }

/* ---------- Guide: click-through course ---------- */

const COURSE = [
  { id: "start", title: "Getting started", lead: "How to use this journal, and keep your sits safe.", cards: [
    { h: "Sit first, write after", b: `<p>Leave the phone in your pocket while you sit. The point is to be with the place, not your screen.</p><p>When you're done, tap <strong>New sit</strong> on the Journal tab and capture what you noticed. It saves as you type, and it remembers your usual spot, so the location fills itself in next time.</p>` },
    { h: "Tag your visitors", b: `<p>Add the birds, animals, plants and insects you meet to <strong>Visitors</strong>, separated by commas. Robin, wren, holly.</p><p>Don't worry about proper names. "Small brown bird with a cocked tail" is a perfectly good start. You can look it up later, or just keep calling it that.</p><p>The <strong>Patterns</strong> tab shows who keeps turning up, and when you first and last saw them.</p>` },
    { h: "Watch the year turn", b: `<p>The Patterns tab lays your sits out month by month, and charts how settled you felt arriving and leaving.</p><p>That second chart is quiet evidence the practice is doing something. Most people arrive busier than they leave.</p>` },
    { h: "Save it to your home screen", b: `<p>It then opens like an app, full screen, with the tree icon.</p><ul><li><strong>iPhone:</strong> open this page in Safari, tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>.</li><li><strong>Android:</strong> open it in Chrome, tap the <strong>⋮</strong> menu, then <strong>Install app</strong> or <strong>Add to Home screen</strong>.</li></ul><p>Do this before you start, then always open it from the icon. On iPhone, the icon keeps its own copy of your sits, separate from Safari.</p>` },
    { h: "Keep your sits safe", b: `<p>Your sits, including any location you save, stay on this device only. Nothing is sent anywhere.</p><p>That's private, but fragile. Clearing your browsing data, using a private window or changing phone will lose them.</p><p>Tap <strong>Export</strong> every few weeks, and always before you clear your data or change phone.</p>` },
  ]},
  { id: "what", title: "What a sit spot is", lead: "One place. Visited again and again. Until it starts to know you back.", cards: [
    { h: "One place, again and again", b: `<p>A sit spot is a single place outdoors that you return to regularly, and sit quietly. That's it.</p><p>No task, no goal, no performance. You're not there to achieve anything. You're there to notice.</p>` },
    { h: "The magic is in the repetition", b: `<p>The first time, you see a tree. By the tenth, you know which branch the robin sings from, where the puddle forms after rain, and what the light does at four o'clock in November.</p><p>You stop being a visitor, and start becoming part of the place.</p>` },
    { h: "Where it comes from", b: `<p>The practice was popularised by Jon Young, a naturalist and tracker, as a core routine of nature connection.</p><p>It's now used by forest school leaders, outdoor therapists and naturalists all over the world, with clients and for themselves.</p>` },
    { h: "What it does for you", b: `<p>Regular, quiet time outside tends to settle the nervous system. Your attention widens. Your breathing slows. The mind gets a rest from its usual loops.</p><p>Over time, many people notice they feel more at home in their own skin, and more connected to where they live.</p>`, t: "Before your next sit, rate how settled you feel from 1 to 5. Do it again as you leave." },
  ]},
  { id: "choose", title: "Choosing your spot", lead: "Close beats beautiful. The best spot is the one you'll actually go to.", cards: [
    { h: "Near home", b: `<p>Five minutes away will get visited. Forty minutes away will become a nice idea.</p><p>The practice works through repetition, so pick somewhere you can reach on a tired Tuesday, not just a sunny Sunday.</p>` },
    { h: "A city park bench counts", b: `<p>So does a canal towpath, a corner of the allotment, a churchyard or the back step.</p><p>Wildlife lives in cities too. A city spot can be just as rich as a remote one, and far easier to keep coming back to. Bushcraft to the city.</p>` },
    { h: "Look for edges", b: `<p>Edges are where wildlife is busiest: where trees meet grass, hedge meets field, or land meets water.</p><p>A spot with a bit of edge in view gives you more to notice, and more visitors over the year.</p>` },
    { h: "Safe enough to soften", b: `<p>Choose somewhere you feel safe enough to let your guard down a little.</p><p>If you're on alert the whole time, scanning for people or worrying about your bag, the practice can't land. That's not a failure. It just means it's time to choose again.</p>` },
    { h: "Stick with it", b: `<p>Give one spot a full season before you change it. The first few visits are often the least interesting. The place needs time to show itself, and you need time to see it.</p>`, t: "Fill in your location in the next sit, and give your spot a name of your own." },
  ]},
  { id: "sit", title: "How to sit", lead: "Arrive. Open. Stay. Let it be simple.", cards: [
    { h: "Arrive", b: `<p>Walk the last bit slowly. Notice your breath and the feel of your feet on the ground.</p><p>Let the day's noise settle. There's no rush to be anywhere else.</p>` },
    { h: "Open the senses, one at a time", b: `<p>What can you hear? Start with the nearest sound, then the furthest. What can you smell? What's touching your skin: air, sun, rain, the ground beneath you?</p><p>Spend a minute or two with each. Then let them all run together.</p>` },
    { h: "Owl eyes", b: `<p>Soften your gaze and take in the whole view at once, edges included, without focusing on any one thing.</p><p>This wide-angle vision picks up movement you'd otherwise miss. Many people find it calms the nervous system too.</p>`, t: "Try two minutes of owl eyes at your next sit. Notice what moves at the edges." },
    { h: "Stay still", b: `<p>Around twenty minutes is a good aim, though five still counts.</p><p>When you arrive, the place reacts. Birds go quiet or move off. Stay still and quiet, and life often returns within ten or fifteen minutes.</p>` },
    { h: "Leave gently", b: `<p>Before you go, notice one thing you'd like to carry into the day. A sound, an image, a feeling.</p><p>That becomes the <strong>One thing to carry</strong> line in your journal, and the title of the sit.</p>` },
  ]},
  { id: "read", title: "Reading the place", lead: "The birds will tell you what's happening, once you learn to listen.", cards: [
    { h: "The baseline", b: `<p>Over time, you'll get a feel for your spot's <em>baseline</em>: what it sounds and looks like when all is calm.</p><p>Once you know the baseline, you notice when it changes. That's where the stories are.</p>` },
    { h: "Song and contact calls", b: `<p>Birdsong and soft contact calls usually mean all is well. Birds are feeding, singing and keeping in touch with each other.</p><p>A relaxed, chattering hedge is a hedge with nothing to worry about.</p>` },
    { h: "Alarm calls", b: `<p>Alarm calls are sharp, repeated and urgent. A blackbird's loud rattling alarm, or a wren scolding hard from the brambles.</p><p>They often mean a cat, a hawk, a dog or a person is moving through. Follow the alarm with your eyes and see what's coming.</p>` },
    { h: "Silence speaks too", b: `<p>Sudden silence can say as much as any call. When a whole area goes quiet, something has usually changed.</p><p>And notice your own part in it: how the place responds to your arrival, and how long it takes to settle back.</p>`, t: "At your next sit, notice when the birds go quiet, and see if you can find out why." },
    { h: "Going deeper", b: `<p>Jon Young's book <em>What the Robin Knows</em> goes much further into bird language, if this catches you. It's one of the best ways to deepen the practice.</p>` },

  { id: "mirror", title: "Nature as mirror", lead: "What you notice out there often says something about what's going on in here.", cards: [
    { h: "What draws you", b: `<p>Some days you'll be drawn to the oak that hasn't moved in two hundred years. Other days, the wind ripping through the branches, or the stream that won't stop moving.</p><p>Neither is random. What catches your eye often reflects something in you.</p>` },
    { h: "Just notice", b: `<p>No need to turn it into meaning straight away. Just notice what caught your attention, and what it stirred.</p><p>Let the image sit with you. Sometimes it makes sense days later.</p>`, t: "In your next sit, write one line in What stirred in me, even if it's just a feeling." },
    { h: "Inner weather", b: `<p>Each sit asks how settled you felt arriving and leaving. It also asks about your inner weather: what stirred in you while you sat.</p><p>Over weeks, you'll start to see your own seasons alongside the land's.</p>` },
    { h: "Nature is the co-facilitator", b: `<p>You don't have to do all the work. The place does a lot of it.</p><p>Show up, sit down, and let the land meet you halfway.</p>` },
  ]},
  { id: "shields", title: "The Four Shields", lead: "A compass for human nature, laid over the seasons of the year.", cards: [
    { h: "A map of the whole person", b: `<p>The Four Shields is a model from Steven Foster and Meredith Little, founders of the School of Lost Borders, a wilderness rites of passage school.</p><p>It maps the human psyche onto the four directions, the four seasons and the stages of a life.</p>` },
    { h: "South and West", b: `<ul><li><strong>South: summer, the child.</strong> The body, feeling, instinct and play. Being fully alive in the senses.</li><li><strong>West: autumn, the adolescent.</strong> Turning inward. Dreams, shadow, introspection and the search for who we really are.</li></ul>` },
    { h: "North and East", b: `<ul><li><strong>North: winter, the adult.</strong> The mind, responsibility and holding others. Structure, service and getting things done.</li><li><strong>East: spring, the elder.</strong> Spirit, insight and renewal. Dawn after the long night.</li></ul>` },
    { h: "Moving round the circle", b: `<p>The idea is that a whole person moves around all four. Most of us get stuck in one or two, and the others call to us.</p><p>A busy parent might live in the North for years, and long for the play of the South.</p>` },
    { h: "Using it at your sit spot", b: `<p>After a sit, ask which direction felt most alive, and pick it in the journal if one stands out. The compass on the Patterns tab shows where you tend to live, and which directions you visit less.</p><p>You can also try sitting facing a different direction, and notice what changes.</p>`, t: "Which shield have you been living in lately? Which one is calling?" },
    { h: "Held lightly", b: `<p>This is a light introduction to a deep model. Foster and Little's work echoes older earth-based traditions.</p><p>We offer it here as one map among many, and as they shared it, not as a teaching we own. Their book, <em>The Four Shields</em>, goes much further.</p>` },
  ]},
  { id: "safe", title: "Safety and access", lead: "Look after yourself, so you can soften.", cards: [
    { h: "Before you go", b: `<ul><li><strong>Let someone know</strong> where you'll be if your spot is quiet or remote.</li><li><strong>Check the weather.</strong> The Weather Wise tool in the Toolkit can help.</li><li><strong>Phone charged,</strong> in your pocket, on silent.</li></ul>` },
    { h: "Dress for sitting still", b: `<p>You'll get colder than you expect. Sitting still burns far less heat than walking.</p><p>Add a layer before you sit, not when you're already cold. A sit mat keeps the cold ground away and makes a big difference.</p>` },
    { h: "Dusk, dark and ticks", b: `<p>Dusk and dark can be beautiful times to sit, but choose a spot you know well, with an easy route out, and bring a head torch.</p><p>Ticks live in long grass and bracken. Check yourself afterwards.</p>` },
    { h: "Access is for everyone", b: `<p>A bench by a path, a wheelchair-friendly spot, a balcony or an open window all count.</p><p>On hard days, a window is enough. The practice is about attention, not distance from a road.</p>` },

    { h: "Where to go next", b: `<ul><li><strong>What the Robin Knows.</strong> Jon Young. Bird language, the baseline and the sit spot.</li><li><strong>Coyote's Guide to Connecting with Nature.</strong> Jon Young, Ellen Haas and Evan McGown. The core routines of nature connection.</li><li><strong>The Forest Unseen.</strong> David Haskell. A biologist watches one square metre of woodland for a year.</li><li><strong>The Four Shields.</strong> Steven Foster and Meredith Little. The model behind the compass.</li></ul>` },
    { h: "Same place. Different day.", b: `<p>That's the course. Come back to any lesson whenever you need it.</p><p>Share what you're noticing in The Outdoor Practice community. Other people's sit spots have a way of deepening your own.</p><p>rewildingtherapies.com</p>` },

const course = { lesson: null, card: 0, finished: false };
function courseDone() { try { return new Set(JSON.parse(localStorage.getItem(COURSE_KEY)) || []); } catch (e) { return new Set(); } }
function markDone(id) { const s = courseDone(); s.add(id); try { localStorage.setItem(COURSE_KEY, JSON.stringify([...s])); } catch (e) {} }
function courseHTML() {
  const done = courseDone();
  if (!course.lesson) {
    const n = COURSE.filter(l => done.has(l.id)).length;
    const next = COURSE.find(l => !done.has(l.id)) || COURSE[0];
    return `<div class="course">
      <div class="c-head"><h2>The Guide</h2><p class="toast">${COURSE.length} ${COURSE_BLURB}. A few minutes each. Take them in order, or dip in.</p>
        <div class="c-prog" role="progressbar" aria-valuemin="0" aria-valuemax="${COURSE.length}" aria-valuenow="${n}"><span style="width:${Math.round(n / COURSE.length * 100)}%"></span></div>
        <div class="row spread"><span class="toast">${n} of ${COURSE.length} done</span><button class="btn primary" data-lesson="${next.id}">${n ? (n === COURSE.length ? "Start again" : "Continue") : "Start"}: ${esc(next.title)}</button></div></div>
      <ol class="lessons">${COURSE.map((l, i) => `<li><button class="lesson-row" data-lesson="${l.id}">
        <span class="l-num ${done.has(l.id) ? "done" : ""}" aria-hidden="true">${done.has(l.id) ? "✓" : i + 1}</span>
        <span class="l-main"><span class="l-title">${esc(l.title)}</span><span class="l-sub">${esc(l.lead)}</span></span>
        <span class="l-meta">${l.cards.length} cards${done.has(l.id) ? '<span class="sr"> · done</span>' : ""}</span></button></li>`).join("")}</ol></div>`;
  }
  const li = COURSE.findIndex(l => l.id === course.lesson), L = COURSE[li];
  const top = `<div class="row spread"><button class="btn ghost" data-course="menu">← All lessons</button><span class="toast">Lesson ${li + 1} of ${COURSE.length}</span></div>`;
  if (course.finished) {
    const nx = COURSE[li + 1];
    return `<div class="course">${top}<article class="c-card c-end"><span class="c-count">Lesson done</span><h3>${esc(L.title)}</h3><p>Nice work. Come back to it any time.</p>
      <div class="row">${nx ? `<button class="btn primary" data-lesson="${nx.id}">Next: ${esc(nx.title)}</button>` : ""}<button class="btn" data-course="journal">Back to the journal</button><button class="btn ghost" data-course="menu">All lessons</button></div></article></div>`;
  }
  const C = L.cards[course.card], last = course.card === L.cards.length - 1;
  return `<div class="course">${top}
    <div class="c-lesson"><h2>${esc(L.title)}</h2><p class="c-lead">${esc(L.lead)}</p></div>
    <article class="c-card" id="c-card" aria-live="polite">
      <span class="c-count">${course.card + 1} of ${L.cards.length}</span>
      <h3>${esc(C.h)}</h3><div class="c-body">${C.b}</div>
      ${C.t ? `<div class="c-try"><span>Try this</span><p>${esc(C.t)}</p></div>` : ""}
    </article>
    <div class="c-dots" aria-hidden="true">${L.cards.map((_, i) => `<i class="${i === course.card ? "on" : i < course.card ? "past" : ""}"></i>`).join("")}</div>
    <div class="row spread"><button class="btn" data-course="back" ${course.card === 0 ? "disabled" : ""}>Back</button>
      <button class="btn primary" data-course="next">${last ? "Finish lesson" : "Next"}</button></div>
  </div>`;
}
function openLesson(id, card) { course.lesson = id; course.card = card || 0; course.finished = false; go("guide"); }
function courseNav(dir) {
  const L = COURSE.find(l => l.id === course.lesson); if (!L || course.finished) return;
  if (dir > 0) { if (course.card < L.cards.length - 1) course.card++; else { markDone(L.id); course.finished = true; } }
  else if (course.card > 0) course.card--;
  render(); const c = document.getElementById("c-card") || document.querySelector(".c-end"); if (c) c.scrollIntoView({ block: "nearest" });
}
let touchX = null;
document.addEventListener("touchstart", e => { if (state.view === "guide" && course.lesson && e.target.closest(".c-card")) touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", e => { if (touchX === null) return; const dx = e.changedTouches[0].clientX - touchX; touchX = null; if (Math.abs(dx) > 50) courseNav(dx < 0 ? 1 : -1); });
document.addEventListener("keydown", e => { if (state.view !== "guide" || !course.lesson || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return; if (e.key === "ArrowRight") courseNav(1); if (e.key === "ArrowLeft") courseNav(-1); });


/* ---------- Navigation ---------- */
function go(view) {
  if (state.view === "edit" && view !== "edit") flush();
  state.view = view;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === view || (view === "edit" && t.dataset.view === "journal"))));
  render(); window.scrollTo({ top: 0 });
}
function openSit(id) {
  const d = state.sits.find(x => x.id === id);
  state.editingId = id; state.draft = structuredClone({ ...blank(), ...d }); state.dirty = false;
  state.confirmDelete = false; state.status = ""; state.locMsg = ""; go("edit");
}
function newSit() {
  state.editingId = "sit-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  state.draft = blank(); state.confirmDelete = false; state.status = ""; state.locMsg = ""; state.dirty = false; go("edit");
}
function removeSit(id) {
  state.sits = state.sits.filter(d => d.id !== id); saveAll();
  state.editingId = null; state.draft = null; state.dirty = false; state.confirmDelete = false; go("journal");
}

/* ---------- Rendering ---------- */
function paintStatus() { const s = $("#status"); if (s) { s.textContent = state.status; s.classList.toggle("err", state.statusErr); } }
function render() {
  const v = $("#view");
  if (state.view === "journal") v.innerHTML = journalHTML();
  else if (state.view === "patterns") v.innerHTML = patternsHTML();
  else if (state.view === "guide") v.innerHTML = courseHTML();
  else if (state.view === "edit") { v.innerHTML = editHTML(); bindEditor(); }
}

function journalHTML() {
  const all = sorted(); const list = [...all].reverse();
  const top = `<div class="row spread"><h2>${list.length ? list.length + (list.length === 1 ? " sit" : " sits") : "Your sits"}</h2>
    <div class="row"><button class="btn export-btn">Export</button><button class="btn primary" id="new">+ New sit</button></div></div>`;
  const msg = exportMsg ? `<p class="toast">${esc(exportMsg)}</p>` : "";
  if (!list.length) {
    return `<div class="sheet">${top}
      <div class="empty">
        <h3>Nothing here yet</h3>
        <p>Your sits will gather here, newest first, with the weather, your visitors and the direction that felt alive. Go and sit first. Then tap <strong>New sit</strong> and write down what you noticed.</p>
        <p>New to this? The <strong>Guide</strong> tab is a short course: choosing a spot, how to sit, reading the place, and the Four Shields.</p>
      </div></div>${msg}`;
  }
  return `<div class="sheet">${top}<div class="list">${list.map(d => {
    const n = all.indexOf(d) + 1;
    const vis = tags(d.visitors).slice(0, 4);
    const weather = [d.temp, ...(d.weather || [])].filter(Boolean).join(", ");
    const title = d.carry || d.place || "Sit";
    return `<button class="item" data-id="${esc(d.id)}">
      <span class="num">${pad(n)}</span>
      <span class="item-main">
        <span class="item-title">${esc(title)}</span>
        <span class="item-meta">${[d.carry && d.place ? d.place : "", weather, d.minutes ? d.minutes + " min" : ""].filter(Boolean).map(esc).join(" · ")}</span>
        ${vis.length || d.shield ? `<span class="chips">${vis.map(s => `<span class="chip">${esc(s)}</span>`).join("")}${d.shield ? `<span class="chip warm">${esc(d.shield)}</span>` : ""}</span>` : ""}
      </span>
      <span class="item-date">${esc(fmtDate(d.date))}</span>
    </button>`;
  }).join("")}</div></div>${msg}`;
}

function patternsHTML() {
  const all = sorted();
  if (!all.length) {
    return `<div class="sheet"><div class="empty"><h3>Patterns grow with time</h3>
      <p>After a few sits, this page shows who keeps visiting your spot, how the months change, how settled you feel arriving and leaving, and where you sit on the Four Shields compass.</p></div></div>`;
  }
  // Visitors
  const map = new Map();
  all.forEach((d, i) => tags(d.visitors).forEach(t => {
    const k = t.toLowerCase();
    if (!map.has(k)) map.set(k, { name: t, count: 0, first: d.date, last: d.date });
    const e = map.get(k); e.count++; e.last = d.date;
  }));
  const vis = [...map.values()].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  // Months
  const months = new Map();
  all.forEach(d => {
    const k = (d.date || "").slice(0, 7); if (!k) return;
    if (!months.has(k)) months.set(k, { n: 0, vis: new Map() });
    const m = months.get(k); m.n++;
    tags(d.visitors).forEach(t => m.vis.set(t.toLowerCase(), t));
  });
  const monthRows = [...months.entries()].sort((a, b) => b[0].localeCompare(a[0])).map(([k, m]) => {
    const label = new Date(k + "-15T12:00:00").toLocaleDateString("en-GB", { month: "long", year: "numeric" });
    const v = [...m.vis.values()].slice(0, 8);
    return `<div class="month"><span class="m">${esc(label)}</span><span class="c">${m.n}</span><span class="chips">${v.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</span></div>`;
  }).join("");
  const totalMin = all.reduce((s, d) => s + (parseFloat(d.minutes) || 0), 0);
  const msg = exportMsg ? `<p class="toast">${esc(exportMsg)}</p>` : "";
  return `<div class="sheet">
    <div class="row spread"><h2>Patterns</h2><button class="btn export-btn">Export all sits</button></div>
    ${msg}
    <div class="stat">
      <div><b>${all.length}</b><span>${all.length === 1 ? "sit" : "sits"}</span></div>
      <div><b>${Math.round(totalMin / 60 * 10) / 10}</b><span>hours sitting</span></div>
      <div><b>${vis.length}</b><span>different visitors</span></div>
      <div><b>${months.size}</b><span>${months.size === 1 ? "month" : "months"}</span></div>
    </div>

    <section class="section block">
      <div class="section-head"><h3>Visitors</h3><span class="hint">who keeps turning up</span></div>
      ${vis.length ? `<div class="table-wrap"><table><thead><tr><th>Visitor</th><th>Sits</th><th>First seen</th><th>Last seen</th></tr></thead><tbody>
        ${vis.map(s => `<tr><td class="v">${esc(s.name)}</td><td class="n">${s.count}</td><td class="d">${esc(fmtDate(s.first))}</td><td class="d">${esc(fmtDate(s.last))}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="toast">Add visitors to a sit, separated by commas. Robin, wren, holly. They'll collect here.</p>`}
    </section>

    <section class="section block">
      <div class="section-head"><h3>Seasons</h3><span class="hint">the year turning at one spot</span></div>
      <div class="months">${monthRows}</div>
    </section>

    <section class="section block">
      <div class="section-head"><h3>Settling</h3><span class="hint">arriving and leaving</span></div>
      ${settleChart(all)}
    </section>

    <section class="section block">
      <div class="section-head"><h3>Four Shields</h3><span class="hint">where your sits tend to live</span></div>
      ${compass(all)}
    </section>
  </div>`;
}

function settleChart(all) {
  const pts = all.filter(d => d.arrive && d.leave).slice(-20);
  if (pts.length < 2) return `<p class="toast">Rate how settled you feel arriving and leaving on at least two sits, and a chart will appear here.</p>`;
  const W = 600, H = 190, L = 30, R = 14, T = 14, B = 26;
  const x = i => L + (pts.length === 1 ? 0 : i * (W - L - R) / (pts.length - 1));
  const y = v => T + (5 - v) * (H - T - B) / 4;
  const grid = [1, 2, 3, 4, 5].map(v => `<line class="ax" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axl" x="${L - 10}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("");
  const line = (k) => pts.map((d, i) => `${x(i).toFixed(1)},${y(d[k]).toFixed(1)}`).join(" ");
  const dots = (k, cls) => pts.map((d, i) => `<circle class="${cls}" cx="${x(i).toFixed(1)}" cy="${y(d[k]).toFixed(1)}" r="${k === "leave" ? 4 : 3.5}"/>`).join("");
  const n0 = all.indexOf(pts[0]) + 1, n1 = all.indexOf(pts[pts.length - 1]) + 1;
  const avgA = pts.reduce((s, d) => s + d.arrive, 0) / pts.length, avgL = pts.reduce((s, d) => s + d.leave, 0) / pts.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="How settled you felt arriving and leaving, sits ${n0} to ${n1}">
      ${grid}
      <polyline class="l-arrive" points="${line("arrive")}"/>
      <polyline class="l-leave" points="${line("leave")}"/>
      ${dots("arrive", "d-arrive")}${dots("leave", "d-leave")}
      <text class="axl" x="${L}" y="${H - 6}">Sit ${pad(n0)}</text>
      <text class="axl" x="${W - R}" y="${H - 6}" text-anchor="end">Sit ${pad(n1)}</text>
    </svg>
    <div class="legend"><span><i></i>Arriving · average ${avgA.toFixed(1)}</span><span><i class="leave"></i>Leaving · average ${avgL.toFixed(1)}</span></div>`;
}

function compass(all) {
  const c = { North: 0, East: 0, South: 0, West: 0 };
  all.forEach(d => { if (c[d.shield] !== undefined) c[d.shield]++; });
  const total = c.North + c.East + c.South + c.West;
  const max = Math.max(...Object.values(c));
  const pos = {
    North: { x: 230, y: 77,  lx: 230, ly: 18,  sub: "WINTER", a: "middle" },
    South: { x: 230, y: 277, lx: 230, ly: 336, sub: "SUMMER", a: "middle" },
    East:  { x: 330, y: 177, lx: 376, ly: 175, sub: "SPRING", a: "start" },
    West:  { x: 130, y: 177, lx: 84,  ly: 175, sub: "AUTUMN", a: "end" },
  };
  const parts = Object.entries(pos).map(([k, p]) => {
    const top = total && c[k] === max;
    const r = total ? 16 + 20 * (c[k] / max) : 16;
    return `<circle class="c-dot${top ? " top" : ""}" cx="${p.x}" cy="${p.y}" r="${r.toFixed(1)}"/>
      <text class="c-num${top ? " top" : ""}" x="${p.x}" y="${p.y + 10}" text-anchor="middle">${c[k]}</text>
      <text class="c-dir" x="${p.lx}" y="${p.ly}" text-anchor="${p.a}">${k}</text>
      <text class="c-sub" x="${p.lx}" y="${p.ly + 15}" text-anchor="${p.a}">${p.sub}</text>`;
  }).join("");
  const svg = `<svg class="compass" viewBox="0 0 460 356" role="img" aria-label="Four Shields: North ${c.North}, East ${c.East}, South ${c.South}, West ${c.West}">
    <circle class="c-ring" cx="230" cy="177" r="100"/>
    <line class="c-cross" x1="230" y1="77" x2="230" y2="277"/><line class="c-cross" x1="130" y1="177" x2="330" y2="177"/>
    ${parts}</svg>`;
  return total ? svg : `${svg}<p class="toast">Pick a direction on a sit and it will be counted here. It's always optional.</p>`;
}

function bindEditor() {
  paintStatus();

  v.querySelectorAll("[data-k]").forEach(el => el.addEventListener("input", () => { d[el.dataset.k] = el.value; scheduleSave(); }));

    const k = group.dataset.multi, set = new Set(d[k]);
    set.has(b.dataset.val) ? set.delete(b.dataset.val) : set.add(b.dataset.val);
    d[k] = WEATHER.filter(w => set.has(w));
    b.setAttribute("aria-pressed", String(set.has(b.dataset.val))); scheduleSave();
  }));
  v.querySelectorAll("[data-single]").forEach(group => group.addEventListener("click", e => {
    const b = e.target.closest("button[data-val]"); if (!b) return;
    const k = group.dataset.single; d[k] = d[k] === b.dataset.val ? "" : b.dataset.val;
    group.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.val === d[k]))); scheduleSave();
  }));
  v.querySelectorAll("[data-scale]").forEach(group => group.addEventListener("click", e => {
    const b = e.target.closest("button[data-v]"); if (!b) return;
    const k = group.dataset.scale, val = +b.dataset.v; d[k] = d[k] === val ? 0 : val;
    group.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.v === d[k]))); scheduleSave();
  }));
  $("#shields").addEventListener("click", e => {
    const b = e.target.closest("button[data-val]"); if (!b) return;
    d.shield = d.shield === b.dataset.val ? "" : b.dataset.val;
    $("#shields").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.val === d.shield)));
    $("#shield-note-wrap").hidden = !d.shield; scheduleSave();
  });
  const get = $("#loc-get");
  if (get) get.onclick = () => {
    if (!navigator.geolocation) { state.locMsg = "This browser can't share a location. Type the place name instead."; flush(); render(); return; }
    get.disabled = true; get.textContent = "Finding you…";
    navigator.geolocation.getCurrentPosition(pos => {
      d.coords = { lat: +pos.coords.latitude.toFixed(5), lon: +pos.coords.longitude.toFixed(5) };
      state.locMsg = ""; scheduleSave(); flush(); render();
    }, err => {
      state.locMsg = err && err.code === 1 ? "Location wasn't allowed. You can turn it on in your browser settings, or just type the place name." : "Couldn't find your location just now. Try again outside, or type the place name.";
      render();
    }, { enableHighAccuracy: true, timeout: 15000 });
  };
  const clr = $("#loc-clear"); if (clr) clr.onclick = () => { d.coords = null; scheduleSave(); flush(); render(); };
  $("#back").onclick = () => go("journal");
  $("#done").onclick = () => go("journal");
  const del = $("#del"); if (del) del.onclick = () => { flush(); state.confirmDelete = true; render(); };
  const yes = $("#del-yes"); if (yes) yes.onclick = () => removeSit(state.editingId);
  const no = $("#del-no"); if (no) no.onclick = () => { state.confirmDelete = false; render(); };
}

function exportText() {
  return sorted().map((d, i) => {
    const L = [`# Sit ${pad(i + 1)}${d.place ? ": " + d.place : ""}`,
      [fmtDate(d.date), d.time, d.minutes ? d.minutes + " min" : "", [d.temp, ...(d.weather || [])].filter(Boolean).join(", ")].filter(Boolean).join(" · ")];
    if (d.coords) L.push(`Location: ${d.coords.lat}, ${d.coords.lon}`);
    L.push("");
    [["Settled arriving", d.arrive ? d.arrive + "/5" : ""], ["Seen", d.seen], ["Heard", d.heard], ["Smelled", d.smelled], ["Felt", d.felt],
     ["Visitors", d.visitors], ["What's changed", d.changed], ["What stirred in me", d.inner],
     ["Four Shields", d.shield ? d.shield + (d.shieldNote ? ": " + d.shieldNote : "") : ""],
     ["Settled leaving", d.leave ? d.leave + "/5" : ""], ["One thing to carry", d.carry]]
      .forEach(([k, v]) => { if (v) L.push(`**${k}:** ${v}`); });
    return L.join("\n");
  }).join("\n\n---\n\n");
}

document.addEventListener("click", e => {
  const tab = e.target.closest(".tab"); if (tab) { exportMsg = ""; go(tab.dataset.view); return; }
  const gl = e.target.closest("[data-guide]"); if (gl) { e.preventDefault(); flush(); openLesson(gl.dataset.guide, 0); return; }
  const ls = e.target.closest("[data-lesson]"); if (ls) { openLesson(ls.dataset.lesson, 0); return; }
  const cc = e.target.closest("[data-course]"); if (cc) {
    const k = cc.dataset.course;
    if (k === "menu") { course.lesson = null; course.finished = false; render(); window.scrollTo({ top: 0 }); }
    else if (k === "journal") { course.lesson = null; course.finished = false; go("journal"); }
    else courseNav(k === "next" ? 1 : -1);
    return;
  }
  if (e.target.closest("#new")) { newSit(); return; }
  const item = e.target.closest(".item"); if (item) { openSit(item.dataset.id); return; }
  if (e.target.closest(".export-btn")) {
    if (!state.sits.length) { exportMsg = "Nothing to export yet. Add your first sit, then export."; render(); return; }
    try {
      const text = "# Sit Spot Journal\n\n" + exportText() + "\n";
      const url = URL.createObjectURL(new Blob([text], { type: "text/markdown" }));
      const a = document.createElement("a"); a.href = url; a.download = "sit-spot-journal-" + today() + ".md";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
      exportMsg = "Exported. Check your downloads.";
    } catch (err) { exportMsg = "Export didn't work in this browser."; }
    render();
  }
});
window.addEventListener("pagehide", flush);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });

load(); render();

<style>

<script>
(function () {
  var NAME = "Sit Spot Journal";
  var KEY = "top-a2hs-later-" + NAME;

  if (standalone) return;
  try { if (Date.now() < +(localStorage.getItem(KEY) || 0)) return; } catch (e) {}

  var android = /Android/i.test(ua);
  var icon = (document.querySelector('link[rel="apple-touch-icon"]') || {}).href || "";
  var shareSvg = '<svg class="a2hs-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>';
  var deferred = null, el = null, spacer = null;

  }

    spacer = document.createElement("div");
    spacer.style.height = (el.offsetHeight + 16) + "px";
    document.body.appendChild(spacer);

  }

  } else if (ios) {

  } else if (android) {

  }

    e.preventDefault(); deferred = e;

  });
